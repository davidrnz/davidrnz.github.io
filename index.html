<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Background</title>
  <style>
    /* Remove default browser margins and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      /* Replace with your image path or URL */
      background-image: url('ChatGPT Image Mar 5, 2026, 01_21_10 AM.png');
      background-size: cover;       /* Scales image to fill the entire screen */
      background-position: center;  /* Centers the image */
      background-repeat: no-repeat; /* Prevents image tiling */
      background-attachment: fixed; /* Keeps background stationary on scroll */
    }
  </style>
</head>
<body>
  <!-- Your page content goes here -->
</body>
</html>
